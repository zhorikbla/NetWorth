<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetWorth — личные финансы</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#0e1014;
      --surface:#171a21;
      --raised:#20242c;
      --text:#f3f4f6;
      --muted:#9299a6;
      --gold:#d9a441;
      --line:#2b303a;
      --tint:rgba(217,164,65,.12);
      --danger:#ef9292;
      --button:#17181b
    }
    [data-theme="light"]{
      color-scheme:light;
      --bg:#f5f4f0;
      --surface:#fff;
      --raised:#eeede9;
      --text:#17181b;
      --muted:#70757d;
      --gold:#b8892d;
      --line:#deded8;
      --tint:rgba(184,137,45,.12);
      --danger:#b73535
    }
    *{box-sizing:border-box}body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif
    }button,input,select{font:inherit}button{cursor:pointer}button:disabled{
      opacity:.45;
      cursor:not-allowed
    }button,input,select{
      outline-offset:4px
    }button:focus-visible,a:focus-visible{
      outline:2px solid var(--gold)
    }button{border:0}h1,h2,h3,p{
      margin:0
    }h1{
      font-size:30px;letter-spacing:-.7px
    }h2{
      font-size:21px;
      letter-spacing:-.3px
    }h3{
      font-size:17px
    }small,.muted{
      color:var(--muted)
    }.shell{
      display:grid;
      grid-template-columns:minmax(0,1fr) 230px;
      min-height:100vh
    }.workspace{
      min-width:0;
      padding:28px 36px 40px;
      max-width:1700px;
      width:100%;
      margin:auto
    }.topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-bottom:26px
    }.brand{
      color:var(--gold);
      font-size:29px;
      font-weight:650;
      letter-spacing:-1px
    }.caption{color:var(--muted);font-size:12px}.top-actions,.actions,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.sidebar{border-left:1px solid var(--line);background:var(--surface);padding:28px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:10px}.nav-item{display:flex;align-items:center;gap:14px;background:none;color:var(--muted);padding:17px 14px;border-radius:12px;text-align:left}.nav-item:hover,.ghost:hover{background:var(--raised);color:var(--text)}.nav-item.active{color:var(--gold);background:var(--tint)}.sidebar-footer{margin-top:auto;padding:16px 12px;color:var(--muted);font-size:12px}.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:12px 18px;font-weight:600;white-space:nowrap}.primary{background:var(--gold);color:var(--button)}.primary:hover{filter:brightness(1.08)}.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}.ghost{background:transparent;color:var(--muted)}.link{background:none;color:var(--gold);padding:4px 0}.danger{color:var(--danger)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 0 22px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:24px}.summary .panel{padding:24px}.label{color:var(--muted);font-size:14px}.value{font-size:clamp(23px,2.6vw,36px);font-weight:650;letter-spacing:-.8px;margin-top:9px;font-variant-numeric:tabular-nums}.chart-panel{margin-bottom:24px}.analytics{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.9fr);gap:36px;padding-top:20px;align-items:center}.chart-left{display:flex;align-items:flex-start;gap:14px;min-width:0}.segmented{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:24px;overflow:hidden;flex-shrink:0}.segmented button{padding:9px 16px;background:none;color:var(--text);font-size:13px}.segmented button.active{background:var(--gold);color:var(--button);font-weight:650}.pie{aspect-ratio:1;border-radius:50%;width:100%;max-width:315px;min-width:100px;margin:34px 0 16px -70px;flex:1}.pie.empty{background:var(--raised)!important;display:grid;place-items:center;color:var(--muted);font-size:14px}.month{display:flex;align-items:center;justify-content:center;gap:18px;white-space:nowrap}.month button{background:none;color:var(--text);font-size:27px;width:36px;height:38px;line-height:1}.month span{min-width:142px;text-align:center;font-size:17px}.legend{margin-top:18px}.legend-item{display:grid;grid-template-columns:14px minmax(0,1fr) auto 56px;gap:12px;align-items:center;padding:10px 0}.dot{height:13px;width:13px;border-radius:50%}.legend-item strong{font-weight:550;white-space:nowrap}.percent{text-align:right;color:var(--muted);font-size:13px}.legend-total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:17px;margin-top:10px;gap:14px}.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px;flex-wrap:wrap}.filters{display:flex;gap:10px;flex-wrap:wrap}input,select{background:var(--raised);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:11px 13px;max-width:100%;min-width:0}input::placeholder{color:var(--muted)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:15px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:13px;font-weight:400}th:first-child,td:first-child{padding-left:0}th:last-child,td:last-child{text-align:right;padding-right:0}td.amount{font-weight:550;font-variant-numeric:tabular-nums}.positive{color:var(--gold)}.badge{display:inline-block;background:var(--raised);padding:3px 10px;border-radius:8px;font-size:12px}.table-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;font-size:13px}.empty-state{text-align:center;color:var(--muted);padding:40px 20px}.category-tabs{display:flex;gap:10px;margin-bottom:22px;overflow-x:auto;padding-bottom:6px}.category-tab{padding:13px 22px;border-radius:10px;background:var(--surface);color:var(--muted);border:1px solid var(--line);white-space:nowrap}.category-tab.active{background:var(--gold);color:var(--button);font-weight:600}.category-layout{display:grid;grid-template-columns:minmax(270px,.75fr) minmax(0,1.3fr);gap:22px}.stack{display:flex;flex-direction:column;gap:16px}.ring{width:min(100%,245px);aspect-ratio:1;border:3px solid var(--gold);border-radius:50%;margin:22px auto 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.ring strong{font-size:30px;letter-spacing:-1px}.budget-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.budget-head .link{font-size:12px}.progress{height:9px;border-radius:10px;background:var(--raised);margin:12px 0;overflow:hidden}.progress span{display:block;height:100%;border-radius:inherit;background:var(--gold)}.progress.over span{background:var(--danger)}.profile-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px}.identity{text-align:center;padding:8px 0 24px;border-bottom:1px solid var(--line);margin-bottom:16px}.avatar{width:88px;height:88px;border-radius:50%;background:var(--tint);border:1px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 15px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.local-nav{display:flex;flex-direction:column;gap:8px}.local-nav button{width:100%}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:flex;flex-direction:column;gap:8px}.field label{color:var(--muted);font-size:14px}.field.full{grid-column:1/-1}.form-section{margin-top:28px}.form-actions{margin-top:28px;padding-top:24px;border-top:1px solid var(--line);display:flex;gap:12px}.notice{background:var(--raised);padding:14px 16px;border-radius:10px;color:var(--muted);font-size:13px;margin-top:20px}.theme-options{display:flex;gap:16px;margin-top:24px}.theme-choice{padding:22px 32px;background:var(--raised);border:1px solid var(--line);border-radius:12px;color:var(--text)}.theme-choice.active{border-color:var(--gold);color:var(--gold)}.boot{max-width:620px;margin:70px auto;padding:38px}.boot p{color:var(--muted);margin:16px 0 24px}.boot .btn{margin-right:12px}dialog{width:min(510px,calc(100% - 32px));padding:28px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.7)}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.close{font-size:26px;background:none;color:var(--muted)}.dialog-form{display:grid;gap:16px}.dialog-form .actions{margin-top:10px;justify-content:flex-end}.error{color:var(--danger);font-size:13px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:5;max-width:90%;border:1px solid var(--gold);background:var(--surface);color:var(--text);border-radius:12px;padding:14px 22px;box-shadow:0 12px 40px #0004}.hidden{display:none!important}
    @media(min-width:1500px){.pie{margin-left:-35px}.chart-left{gap:25px}}
    @media(max-width:1100px){.workspace{padding:24px}.shell{grid-template-columns:minmax(0,1fr) 195px}.analytics{grid-template-columns:1fr;gap:12px}.chart-left{justify-content:center}.pie{max-width:260px;margin-left:0}.legend-item{padding:8px 0}.category-layout{grid-template-columns:1fr}.profile-layout{grid-template-columns:210px minmax(0,1fr)}.form-grid{grid-template-columns:1fr}.summary{gap:12px}.summary .panel{padding:18px}}
    @media(max-width:760px){.shell{display:flex;flex-direction:column}.sidebar{position:static;order:-1;height:auto;flex-direction:row;padding:8px;border-left:0;border-bottom:1px solid var(--line);overflow-x:auto}.sidebar-footer{display:none}.nav-item{padding:12px;font-size:12px;gap:8px;white-space:nowrap}.workspace{padding:20px 14px}.topbar{align-items:flex-start}.brand{font-size:25px}.caption{max-width:230px}.top-actions .btn{padding:9px 12px;font-size:12px}.summary{grid-template-columns:1fr}.summary .panel{display:flex;align-items:center;justify-content:space-between}.value{margin-top:0;font-size:25px}.page-heading{flex-wrap:wrap}.panel{padding:18px}.profile-layout{grid-template-columns:1fr}.identity{display:none}.local-nav{flex-direction:row;overflow-x:auto}.local-nav button{width:auto}.profile-nav{padding:10px}.chart-left{flex-direction:column;align-items:center}.pie{margin:12px 0}.legend-item{grid-template-columns:12px minmax(0,1fr) auto 44px;gap:8px;font-size:13px}.month{gap:6px}.filters{width:100%}.filters select{flex:1;width:130px}.theme-choice{padding:18px}.table-footer{flex-wrap:wrap}}
    .workspace{margin:0 auto}
    @media(max-width:760px){.summary .panel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px}.summary .panel small{grid-column:1/-1}.summary .label{min-width:0}.summary .value{font-size:24px}}
  </style>
</head>
<body>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs>
    <symbol id="wallet" viewBox="0 0 24 24"><path d="M20 8V5a2 2 0 0 0-2-2L5 5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h15V8H5a2 2 0 0 1 0-4"/><path d="M20 12h-5v5h5M17 14.5h.1"/></symbol>
    <symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/></symbol>
    <symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/></symbol>
    <symbol id="lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
    <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></symbol>
  </defs></svg>
  <div class="shell">
    <div class="workspace">
      <header class="topbar"><div><div class="brand">NetWorth</div><p class="caption">Учебный макет · изменения действуют до перезагрузки</p></div><div class="top-actions"><button class="btn secondary" id="load-file">Загрузить mock.json</button></div></header>
      <main id="content"><section class="panel boot"><h1>Загружаем данные…</h1><p>Подготавливаем ваш финансовый обзор.</p></section></main>
    </div>
    <nav class="sidebar" aria-label="Основная навигация">
      <button class="nav-item active" data-page="finance"><svg class="icon"><use href="#wallet"/></svg>Мои финансы</button>
      <button class="nav-item" data-page="categories"><svg class="icon"><use href="#grid"/></svg>Категории</button>
      <button class="nav-item" data-page="profile"><svg class="icon"><use href="#person"/></svg>Личный кабинет</button>
      <div class="sidebar-footer">NETWORTH / DEMO<br>HTML + mock.json</div>
    </nav>
  </div>
  <input id="mock-file" type="file" accept=".json,application/json" hidden>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div class="toast hidden" id="toast" role="status"></div>
  <script>
    'use strict';
    // Форматы сущностей соответствуют API. _demo содержит только настройки макета.
    let db=null, page='finance', month='2026-10', chartKind='expense', selectedCategory=null;
    let categoryFilter='', typeFilter='', visibleCount=20, profileTab='personal', avatarUrl='', toastTimer;
    const colors=['#d9a441','#6885ad','#739b87','#ce8672','#9c8acd','#94a5b5'];
    const content=document.querySelector('#content'), modal=document.querySelector('#modal');
    const money=new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',minimumFractionDigits:2,maximumFractionDigits:2});
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const rub=value=>money.format(Number(value));
    const sum=items=>items.reduce((total,item)=>total+Math.round(Number(item.summ)*100),0)/100;
    const categoryName=id=>db.categories.find(c=>Number(c.category_id)===Number(id))?.name??'Без категории';
    const categoryColor=id=>colors[Math.max(0,db.categories.findIndex(c=>Number(c.category_id)===Number(id)))%colors.length];
    const dateLabel=value=>value.slice(0,10).split('-').reverse().join('.');
    function monthLabel(){const [y,m]=month.split('-').map(Number);const text=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,1))).replace(/\s*г\.$/,'');return text.charAt(0).toUpperCase()+text.slice(1)}
    function periodOps(){return db.operations.filter(op=>op.data.slice(0,7)===month).sort((a,b)=>b.data.localeCompare(a.data)||b.operation_id-a.operation_id)}
    function stats(items){const income=sum(items.filter(o=>o.kind==='income')),expense=sum(items.filter(o=>o.kind==='expense'));return{income,expense,balance:Math.round((income-expense)*100)/100}}
    function monthControl(){return `<div class="month"><button data-action="month-prev" aria-label="Предыдущий месяц">‹</button><span>${esc(monthLabel())}</span><button data-action="month-next" aria-label="Следующий месяц">›</button></div>`}
    function toast(text){clearTimeout(toastTimer);const element=document.querySelector('#toast');element.textContent=text;element.classList.remove('hidden');toastTimer=setTimeout(()=>element.classList.add('hidden'),4200)}
    function render(){if(!db)return;document.querySelectorAll('[data-page]').forEach(button=>{const active=button.dataset.page===page;button.classList.toggle('active',active);if(active)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')});content.innerHTML=page==='finance'?financePage():page==='categories'?categoriesPage():profilePage();document.title=`NetWorth — ${page==='finance'?'Мои финансы':page==='categories'?'Категории':'Личный кабинет'}`}
    function chart(){const items=periodOps().filter(o=>o.kind===chartKind);const total=sum(items);const groups=db.categories.map(c=>({...c,amount:sum(items.filter(o=>o.category_id===c.category_id))})).filter(c=>c.amount>0).sort((a,b)=>b.amount-a.amount);let position=0;const segments=groups.map(c=>{const start=position;position+=c.amount/total*100;return `${categoryColor(c.category_id)} ${start}% ${position}%`}).join(',');return `<section class="panel chart-panel"><h2>По категориям</h2><div class="analytics"><div class="chart-left"><div class="segmented" role="group" aria-label="Тип диаграммы"><button data-kind="expense" aria-pressed="${chartKind==='expense'}" class="${chartKind==='expense'?'active':''}">Расходы</button><button data-kind="income" aria-pressed="${chartKind==='income'}" class="${chartKind==='income'?'active':''}">Доходы</button></div><div class="pie ${total?'':'empty'}" role="img" aria-label="${chartKind==='expense'?'Расходы':'Доходы'} по категориям; значения в легенде" style="background:${total?'conic-gradient('+segments+')':'var(--raised)'}">${total?'':'Нет операций'}</div></div><div>${monthControl()}<div class="legend">${groups.length?groups.map(c=>`<div class="legend-item"><span class="dot" style="background:${categoryColor(c.category_id)}"></span><span>${esc(c.name)}</span><strong>${rub(c.amount)}</strong><span class="percent">${(c.amount/total*100).toLocaleString('ru-RU',{maximumFractionDigits:1})}%</span></div>`).join(''):'<p class="empty-state">За этот месяц операций нет</p>'}</div><div class="legend-total"><span class="muted">Всего ${chartKind==='expense'?'расходов':'доходов'}</span><strong>${rub(total)}</strong></div></div></div></section>`}
    function table(items,showCategory=true){const visible=items.slice(0,visibleCount);return `<div class="table-wrap"><table><thead><tr><th scope="col">Дата</th><th scope="col">Операция</th>${showCategory?'<th scope="col">Категория</th>':''}<th scope="col">Сумма</th></tr></thead><tbody>${visible.map(o=>`<tr><td>${dateLabel(o.data)}</td><td>${esc(o.comment||'Без описания')}</td>${showCategory?`<td><span class="badge">${esc(categoryName(o.category_id))}</span></td>`:''}<td class="amount ${o.kind==='income'?'positive':''}">${o.kind==='income'?'+':'−'}${rub(o.summ)}</td></tr>`).join('')||`<tr><td colspan="${showCategory?4:3}"><p class="empty-state">Операций по выбранным условиям нет</p></td></tr>`}</tbody></table></div><div class="table-footer"><span class="muted">Показано ${visible.length} из ${items.length} операций</span>${items.length>visible.length?'<button class="link" data-action="more">Все операции ↓</button>':items.length>20?'<button class="link" data-action="less">Свернуть ↑</button>':''}</div>`}
    function financePage(){const current=stats(periodOps()),all=stats(db.operations);const items=periodOps().filter(o=>(!categoryFilter||String(o.category_id)===categoryFilter)&&(!typeFilter||o.kind===typeFilter));return `<div class="page-heading"><h1>Мои финансы</h1><button class="btn primary" data-action="add-operation">+ Добавить операцию</button></div><section class="summary" aria-label="Финансовые итоги"><article class="panel"><p class="label">Общий баланс</p><p class="value">${rub(all.balance)}</p><small>Доходы минус расходы за всё время</small></article><article class="panel"><p class="label">Доходы за месяц</p><p class="value">${rub(current.income)}</p></article><article class="panel"><p class="label">Расходы за месяц</p><p class="value">${rub(current.expense)}</p></article></section>${chart()}<section class="panel"><div class="panel-heading"><h2>История операций</h2><div class="filters"><select id="category-filter" aria-label="Фильтр по категории"><option value="">Все категории</option>${db.categories.map(c=>`<option value="${c.category_id}" ${String(c.category_id)===categoryFilter?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select id="type-filter" aria-label="Фильтр по типу"><option value="">Все операции</option><option value="income" ${typeFilter==='income'?'selected':''}>Доходы</option><option value="expense" ${typeFilter==='expense'?'selected':''}>Расходы</option></select></div></div>${table(items)}</section>`}
    function budgetCard(categoryId=null){const isOverall=categoryId===null;const record=isOverall?null:db.limits.find(l=>l.category_id===categoryId&&l.data.slice(0,7)===month);const limit=isOverall?db._demo.overallMonthlyLimit:record?.limit_summ;const spent=sum(periodOps().filter(o=>o.kind==='expense'&&(isOverall||o.category_id===categoryId)));const remaining=limit==null?null:Math.round((Number(limit)-spent)*100)/100;return `<section class="panel"><div class="budget-head"><h3>${isOverall?'Общий лимит расходов':'Лимит категории'}</h3><button class="link" data-action="edit-limit" data-id="${isOverall?'overall':categoryId}">${limit==null?'Установить':'Изменить'}</button></div><p><strong>${rub(spent)}</strong>${limit==null?'':' <span class="muted">из '+rub(limit)+'</span>'}</p><div class="progress ${remaining<0?'over':''}"><span style="width:${limit?Math.min(100,spent/limit*100):0}%"></span></div><small class="${remaining<0?'danger':''}">${remaining==null?'Лимит не установлен':remaining<0?'Перерасход '+rub(-remaining):'Осталось '+rub(remaining)}</small>${isOverall?'<p class="caption" style="margin-top:8px">Общий лимит — демонстрационная настройка макета</p>':''}</section>`}
    function categoriesPage(){if(!db.categories.some(c=>c.category_id===selectedCategory))selectedCategory=db.categories[0]?.category_id;const c=db.categories.find(item=>item.category_id===selectedCategory);const items=periodOps().filter(o=>o.category_id===selectedCategory);const totals=stats(items);return `<div class="page-heading"><h1>Категории</h1>${monthControl()}</div><div class="category-tabs">${db.categories.map(c=>`<button class="category-tab ${c.category_id===selectedCategory?'active':''}" data-category="${c.category_id}" aria-pressed="${c.category_id===selectedCategory}">${esc(c.name)}</button>`).join('')}<button class="btn secondary" style="color:var(--gold);border-color:var(--gold)" data-action="add-category">+ Новая категория</button></div>${!c?'<section class="panel empty-state">Создайте первую категорию</section>':`<div class="category-layout"><div class="stack"><section class="panel"><div class="panel-heading"><h2>${esc(c.name)}</h2><div class="actions"><button class="link" data-action="rename-category">Изменить</button><button class="link danger" data-action="delete-category">Удалить</button></div></div><div class="ring"><strong>${rub(chartKind==='expense'?totals.expense:totals.income)}</strong><span class="muted">${chartKind==='expense'?'Расходы':'Доходы'} за месяц</span></div><div class="row" style="justify-content:center;margin-top:16px"><div class="segmented"><button data-kind="expense" class="${chartKind==='expense'?'active':''}">Расходы</button><button data-kind="income" class="${chartKind==='income'?'active':''}">Доходы</button></div></div></section>${budgetCard(c.category_id)}${budgetCard()}</div><section class="panel"><div class="panel-heading"><div><h2>Операции категории</h2><p class="muted">${esc(c.name)} · ${esc(monthLabel())}</p></div><button class="btn primary" data-action="add-operation">+ Операция</button></div>${table(items,false)}<div class="legend-total"><span class="muted">Доходы / расходы</span><strong>${rub(totals.income)} / ${rub(totals.expense)}</strong></div></section></div>`}`}
    function avatar(){return avatarUrl?`<img src="${esc(avatarUrl)}" alt="Аватар пользователя">`:esc(db.user.nickname.slice(0,2).toUpperCase())}
    function profilePage(){const tabNames={personal:'Личные данные',security:'Безопасность',appearance:'Оформление'};let detail='';if(profileTab==='personal')detail=`<p class="muted">Обновите информацию о себе</p><form id="profile-form" class="form-section"><div class="form-grid"><div class="field"><label for="nickname">Никнейм</label><input id="nickname" name="nickname" value="${esc(db.user.nickname)}" minlength="2" maxlength="40" required></div><div class="field"><label for="phone">Номер телефона</label><input id="phone" name="phone" type="tel" value="${esc(db._demo.phone||'')}" placeholder="+7 900 000-00-00" maxlength="30"></div><div class="field full"><label for="email">Email</label><input id="email" type="email" value="${esc(db.user.email)}" readonly></div><div class="field full"><label for="avatar-input">Фото профиля</label><div class="row"><div class="avatar" style="margin:0;width:64px;height:64px;font-size:22px">${avatar()}</div><input id="avatar-input" type="file" accept="image/png,image/jpeg"><small>JPG или PNG, до 3 МБ</small></div></div></div><p class="notice">Это демонстрационный профиль. Телефон и аватар показываются локально; запросы к серверу не отправляются.</p><div class="form-actions"><button class="btn primary" type="submit">Сохранить изменения</button><button class="btn secondary" type="button" data-action="cancel-profile">Отмена</button></div></form>`;else if(profileTab==='security')detail=`<p class="muted">Настройки доступа к аккаунту</p><div class="notice">В этой учебной версии вход и смена пароля не подключены к серверу. Пароли и токены в mock.json не хранятся.</div><div class="form-section"><p class="label">Email аккаунта</p><p>${esc(db.user.email)}</p></div>`;else detail=`<p class="muted">Выберите удобную тему интерфейса</p><div class="theme-options"><button class="theme-choice ${document.documentElement.dataset.theme==='dark'?'active':''}" data-theme-choice="dark">☾ Тёмная</button><button class="theme-choice ${document.documentElement.dataset.theme==='light'?'active':''}" data-theme-choice="light">☀ Светлая</button></div><p class="notice">Тема применяется ко всем разделам до перезагрузки страницы.</p>`;return `<div class="page-heading"><div><h1>Личный кабинет</h1><p class="muted">Управляйте профилем и настройками</p></div></div><div class="profile-layout"><section class="panel profile-nav"><div class="identity"><div class="avatar">${avatar()}</div><h3>${esc(db.user.nickname)}</h3><p class="muted">${esc(db.user.email)}</p></div><div class="local-nav">${Object.entries(tabNames).map(([key,title])=>`<button class="nav-item ${profileTab===key?'active':''}" data-profile-tab="${key}"><svg class="icon"><use href="#${key==='personal'?'person':key==='security'?'lock':'sun'}"/></svg>${title}</button>`).join('')}</div></section><section class="panel"><h2>${tabNames[profileTab]}</h2>${detail}</section></div>`}
    function openModal(title,body,onSubmit){modal.innerHTML=`<div class="dialog-head"><h2 id="modal-title">${esc(title)}</h2><button class="close" type="button" aria-label="Закрыть" data-close>×</button></div><form class="dialog-form">${body}<p class="error" id="modal-error" role="alert"></p><div class="actions"><button class="btn secondary" type="button" data-close>Отмена</button><button class="btn primary" type="submit">Сохранить</button></div></form>`;modal.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>modal.close());modal.querySelector('form').onsubmit=event=>{event.preventDefault();try{onSubmit(new FormData(event.currentTarget));modal.close();render()}catch(error){modal.querySelector('#modal-error').textContent=error.message}};modal.showModal()}
    function addOperation(){if(!db.categories.length){toast('Сначала создайте категорию');return}openModal('Добавить операцию',`<div class="field"><label for="op-kind">Тип</label><select id="op-kind" name="kind"><option value="expense">Расход</option><option value="income">Доход</option></select></div><div class="field"><label for="op-amount">Сумма, ₽</label><input id="op-amount" name="summ" type="number" min="0.01" max="999999999" step="0.01" required placeholder="0,00"></div><div class="field"><label for="op-category">Категория</label><select id="op-category" name="category_id">${db.categories.map(c=>`<option value="${c.category_id}" ${page==='categories'&&c.category_id===selectedCategory?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label for="op-date">Дата</label><input id="op-date" name="data" type="date" value="${month}-21" required></div><div class="field"><label for="op-comment">Описание</label><input id="op-comment" name="comment" maxlength="120" placeholder="Например, продукты на неделю"></div>`,form=>{const amount=Number(form.get('summ'));if(!Number.isFinite(amount)||amount<=0)throw Error('Укажите положительную сумму');const date=String(form.get('data'));if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('Укажите дату');db.operations.push({operation_id:Math.max(0,...db.operations.map(o=>o.operation_id))+1,summ:Math.round(amount*100)/100,kind:form.get('kind'),category_id:Number(form.get('category_id')),data:date,comment:form.get('comment').trim()});month=date.slice(0,7);categoryFilter='';typeFilter='';visibleCount=20;toast('Операция добавлена в демонстрационные данные')})}
    function editCategory(rename=false){const c=db.categories.find(c=>c.category_id===selectedCategory);openModal(rename?'Изменить категорию':'Новая категория',`<div class="field"><label for="cat-name">Название</label><input id="cat-name" name="name" minlength="2" maxlength="40" required value="${rename?esc(c.name):''}" placeholder="Например, развлечения"></div>`,form=>{const name=form.get('name').trim();if(name.length<2)throw Error('Название должно содержать минимум 2 символа');if(rename)c.name=name;else{selectedCategory=Math.max(0,...db.categories.map(c=>c.category_id))+1;db.categories.push({category_id:selectedCategory,name,user_id:db.user.user_id})}toast(rename?'Название изменено':'Категория создана')})}
    function editLimit(id){const overall=id==='overall';const categoryId=Number(id);const record=db.limits.find(l=>l.category_id===categoryId&&l.data.slice(0,7)===month);openModal(overall?'Общий лимит расходов':'Лимит категории',`<p class="muted">${overall?'Демонстрационный лимит на каждый месяц':esc(monthLabel())}</p><div class="field"><label for="limit-value">Лимит, ₽</label><input id="limit-value" name="amount" type="number" min="0.01" max="999999999" step="0.01" required value="${overall?db._demo.overallMonthlyLimit??'':record?.limit_summ??''}"></div>`,form=>{const amount=Math.round(Number(form.get('amount'))*100)/100;if(!Number.isFinite(amount)||amount<=0)throw Error('Укажите положительную сумму');if(overall)db._demo.overallMonthlyLimit=amount;else if(record)record.limit_summ=amount;else db.limits.push({limit_id:Math.max(0,...db.limits.map(l=>l.limit_id))+1,category_id:categoryId,data:month+'-01',limit_summ:amount});toast('Лимит изменён в макете')})}
    document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.id==='load-file'||button.dataset.action==='choose-file'){document.querySelector('#mock-file').click();return}if(!db)return;if(button.dataset.page){page=button.dataset.page;visibleCount=20;render();return}if(button.dataset.kind){chartKind=button.dataset.kind;render();return}if(button.dataset.category){selectedCategory=Number(button.dataset.category);visibleCount=20;render();return}if(button.dataset.profileTab){profileTab=button.dataset.profileTab;render();return}if(button.dataset.themeChoice){document.documentElement.dataset.theme=button.dataset.themeChoice;render();return}const action=button.dataset.action;if(action==='month-prev'||action==='month-next'){const [y,m]=month.split('-').map(Number);const date=new Date(Date.UTC(y,m-1+(action==='month-next'?1:-1),1));month=date.toISOString().slice(0,7);visibleCount=20;render()}else if(action==='more'){visibleCount+=20;render()}else if(action==='less'){visibleCount=20;render()}else if(action==='add-operation')addOperation();else if(action==='add-category')editCategory();else if(action==='rename-category')editCategory(true);else if(action==='edit-limit')editLimit(button.dataset.id);else if(action==='cancel-profile')render();else if(action==='delete-category'){if(db.operations.some(o=>o.category_id===selectedCategory)||db.limits.some(l=>l.category_id===selectedCategory)){toast('Нельзя удалить категорию: с ней связаны операции или лимиты');return}openModal('Удалить категорию',`<p>Удалить «${esc(categoryName(selectedCategory))}» из демонстрационных данных?</p>`,()=>{db.categories=db.categories.filter(c=>c.category_id!==selectedCategory);selectedCategory=null;toast('Категория удалена')})}});
    document.addEventListener('change',event=>{if(event.target.id==='category-filter'){categoryFilter=event.target.value;visibleCount=20;render()}else if(event.target.id==='type-filter'){typeFilter=event.target.value;visibleCount=20;render()}else if(event.target.id==='avatar-input'){const file=event.target.files[0];if(!file)return;if(!['image/jpeg','image/png'].includes(file.type)||file.size>3*1024*1024){toast('Выберите JPG или PNG размером до 3 МБ');event.target.value=''}}});
    document.addEventListener('submit',event=>{if(event.target.id!=='profile-form')return;event.preventDefault();const form=new FormData(event.target);const nickname=String(form.get('nickname')).trim();if(nickname.length<2){toast('Никнейм должен содержать минимум 2 символа');return}db.user.nickname=nickname;db._demo.phone=String(form.get('phone')).trim();const file=document.querySelector('#avatar-input').files[0];if(file){if(avatarUrl)URL.revokeObjectURL(avatarUrl);avatarUrl=URL.createObjectURL(file)}toast('Изменения сохранены в демонстрационном профиле');render()});
    function validate(data){if(!data||!data.user||typeof data.user.nickname!=='string'||typeof data.user.email!=='string'||!Array.isArray(data.categories)||!Array.isArray(data.operations))throw Error('В файле нужны user, categories и operations');if(!data.categories.every(c=>Number.isInteger(c.category_id)&&c.category_id>0&&typeof c.name==='string'))throw Error('Проверьте поля категорий');if(!data.operations.every(o=>Number.isInteger(o.operation_id)&&typeof o.data==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(o.data)&&Number.isFinite(Number(o.summ))&&Number(o.summ)>0&&['income','expense'].includes(o.kind)&&data.categories.some(c=>c.category_id===o.category_id)))throw Error('Проверьте поля операций и category_id');if(data.limits&&!Array.isArray(data.limits))throw Error('limits должен быть массивом');return data}
    function useData(data){db=validate(data);db.limits??=[];db._demo??={};month=/^\d{4}-(0[1-9]|1[0-2])$/.test(db._demo.month||'')?db._demo.month:db.operations[0]?.data.slice(0,7)||'2026-10';page='finance';selectedCategory=db.categories[0]?.category_id;categoryFilter='';typeFilter='';visibleCount=20;chartKind='expense';if(avatarUrl)URL.revokeObjectURL(avatarUrl);avatarUrl='';render()}
    function showLoader(error=''){content.innerHTML=`<section class="panel boot"><h1>Откройте данные NetWorth</h1><p>Нажмите кнопку и выберите файл <strong>mock.json</strong> из той же папки, что и эта страница. Это нужно один раз после открытия HTML двойным щелчком.</p><button class="btn primary" data-action="choose-file">Выбрать mock.json</button>${error?`<p class="error">${esc(error)}</p>`:''}<p class="caption">При запуске через локальный HTTP-сервер файл загружается автоматически.</p></section>`}
    document.querySelector('#mock-file').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{useData(JSON.parse(await file.text()));toast('Данные из mock.json загружены')}catch(error){if(db)toast('Не удалось загрузить файл: '+error.message);else showLoader('Не удалось прочитать JSON: '+error.message)}finally{event.target.value=''}});
    async function start(){if(location.protocol==='file:'){showLoader();return}try{const response=await fetch('./mock.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);useData(await response.json())}catch(error){showLoader('Автозагрузка не удалась. Можно выбрать файл вручную.')}}
    start();
  </script>
</body>
</html>
